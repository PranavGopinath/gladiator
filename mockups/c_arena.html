<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gladiator · Trial by Combat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="seed.js"></script>
<style>
:root{--bg:#160f2e;--bg2:#241747;--ink:#fff;--dim:#c3b8e8;--faint:#8b7fc4;
 --hp:#44e07a;--hp2:#ffd23f;--hp3:#ff5b6e;--gold:#ffd23f;--card:#2a1c52;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1100px 700px at 50% -5%,#3a2470,#160f2e 60%),#160f2e;
 color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.m{font-family:'JetBrains Mono',monospace}
.fd{font-family:Fredoka,Inter,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:16px 20px 40px}
.top{display:flex;align-items:center;gap:14px;padding:6px 2px 16px}
.logo{font-family:Fredoka;font-weight:700;font-size:26px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.logo .mk{font-size:30px}
.vs-clock{margin-left:auto;display:flex;align-items:center;gap:20px}
.pz{background:#ff4d6d;color:#fff;font-family:Fredoka;font-weight:700;padding:6px 14px;border-radius:999px;font-size:14px;box-shadow:0 6px 0 #c42a48}
.clock{font-family:Fredoka;font-weight:700;font-size:34px;color:var(--gold);text-shadow:0 3px 0 #0004}
.clock small{display:block;font-size:10px;letter-spacing:.2em;color:var(--faint);font-family:Inter;font-weight:700}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:900px){.stage{grid-template-columns:1fr}}
/* fighter card */
.fighter{background:linear-gradient(180deg,var(--card),#20143f);
 border:2px solid #3d2c70;border-radius:22px;padding:18px;position:relative;overflow:hidden;
 box-shadow:0 14px 0 #00000030,inset 0 1px 0 #ffffff14}
.fighter.lead{border-color:var(--gold);box-shadow:0 0 0 2px #ffd23f55,0 14px 0 #00000030}
.fighter.ko{filter:grayscale(.75);opacity:.6}
.crown{position:absolute;top:-2px;right:16px;font-size:30px;filter:drop-shadow(0 3px 0 #0005)}
.fhead{display:flex;align-items:center;gap:14px}
.mascot{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;font-size:44px;flex:none;
 position:relative;box-shadow:inset 0 -6px 0 #0003,0 4px 0 #0004}
.fighter h2{font-family:Fredoka;font-weight:700;font-size:28px;line-height:1}
.fighter .model{font-size:12px;color:var(--dim)}
.rec{font-family:Fredoka;font-size:12px;color:var(--gold);margin-top:3px}
.streak{display:inline-flex;align-items:center;gap:3px;background:#3a1f10;border:1px solid #ff8a3d55;color:#ff9f4d;
 padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:6px}
/* hearts / hp */
.hpwrap{margin-top:16px}
.hprow{display:flex;justify-content:space-between;align-items:center;font-family:Fredoka;font-size:13px;color:var(--dim);margin-bottom:6px}
.hpbar{height:20px;border-radius:999px;background:#140c2b;overflow:hidden;border:2px solid #0006;position:relative}
.hpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#6cff9e,#2fcf6a);box-shadow:inset 0 -5px 0 #0002;transition:width .5s}
.dmg{position:absolute;right:12px;top:-34px;font-family:Fredoka;font-weight:700;font-size:30px;color:#ff5b6e;text-shadow:0 3px 0 #0006}
/* energy / stat pills */
.pills{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pill{background:#1c1239;border:1px solid #3a2a68;border-radius:12px;padding:8px 11px;flex:1;min-width:70px}
.pill .v{font-family:Fredoka;font-weight:700;font-size:20px;line-height:1}
.pill .k{font-size:9px;letter-spacing:.08em;color:var(--faint);margin-top:2px;font-weight:700}
.speech{margin-top:14px;background:#1a1138;border:1px solid #33245f;border-radius:14px;padding:10px 13px;font-size:13px;color:var(--dim);position:relative}
.speech b{color:#fff}
.speech::before{content:'';position:absolute;top:-8px;left:28px;border:7px solid transparent;border-bottom-color:#33245f}
.koban{margin-top:14px;text-align:center;font-family:Fredoka;font-weight:700;color:#ff5b6e;font-size:16px}
.koban small{display:block;color:var(--faint);font-weight:500;font-size:11px;font-family:Inter}
/* bottom: feed + predict */
.low{display:grid;grid-template-columns:1fr 330px;gap:18px}
@media(max-width:900px){.low{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,#241645,#1b1138);border:2px solid #34245f;border-radius:20px;overflow:hidden}
.ph{padding:14px 18px;font-family:Fredoka;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.ph .badge{font-size:11px;background:#ff4d6d;padding:3px 10px;border-radius:999px;font-family:Inter;font-weight:700}
.evt{display:flex;gap:11px;align-items:center;padding:11px 18px;border-top:1px solid #2a1c52}
.evt .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.evt .tx{font-size:13.5px}.evt .tx b{font-weight:700}
.evt .tt{margin-left:auto;font-family:'JetBrains Mono';font-size:11px;color:var(--faint)}
.evt.elim{background:linear-gradient(90deg,#3a1420,transparent)}
/* predict card battler style */
.predopt{margin:12px 16px;background:#1c1239;border:2px solid #3a2a68;border-radius:16px;padding:12px;cursor:pointer}
.predopt.sel{border-color:var(--gold);box-shadow:0 0 0 3px #ffd23f33}
.predopt .r1{display:flex;justify-content:space-between;align-items:center;font-family:Fredoka;font-weight:700;font-size:16px}
.predopt .od{color:var(--gold)}
.pbar{height:9px;border-radius:999px;background:#140c2b;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%}
.betbtn{margin:8px 16px 14px;display:block;width:calc(100% - 32px);font-family:Fredoka;font-weight:700;font-size:17px;
 padding:14px;border:none;border-radius:16px;background:linear-gradient(180deg,#ffd23f,#f5b400);color:#3a2600;box-shadow:0 6px 0 #c08f00;cursor:pointer}
.coins{text-align:center;font-family:Fredoka;color:var(--gold);padding:0 0 14px;font-size:14px}
</style></head><body>
<div class="wrap">
 <div class="top">
  <div class="logo"><span class="mk">🛡️</span><span class="fd">GLADIATOR</span></div>
  <span class="m" style="color:var(--faint);font-size:12px">LAST FIGHTER STANDING · SEASON 3</span>
  <div class="vs-clock"><span class="pz">⚔️ CLUTCH · 2 LEFT</span>
   <div class="clock" style="text-align:right">00:45<small>SUDDEN DEATH SOON</small></div></div>
 </div>

 <div class="stage" id="stage"></div>

 <div class="low">
  <div class="panel">
   <div class="ph">BATTLE LOG <span class="badge" id="n"></span></div>
   <div id="feed"></div>
  </div>
  <div class="panel">
   <div class="ph">🪙 PLACE YOUR BET</div>
   <div id="opts"></div>
   <button class="betbtn">LOCK IN 250 🪙</button>
   <div class="coins">Your coins: <b>3,960</b> · Season rank #4</div>
  </div>
 </div>
</div>
<script>
const S=window.ARENA_SEED, A=S.agents, byId=i=>A.find(a=>a.id===i);
const face={grok:'🤖',codex:'🦾',gemini:'✨',claude:'🧡'};
const faceKO='💀';
const speech={grok:'Opponent session down. Holding the line! 💪',codex:'They breached port 22… rebuilding defenses!'};
const hpGrad=v=>v>60?'linear-gradient(180deg,#6cff9e,#2fcf6a)':v>30?'linear-gradient(180deg,#ffe16c,#f5b400)':'linear-gradient(180deg,#ff8a9c,#ff3b56)';
// order: alive leader first
const ord=[...A].sort((a,b)=>(b.alive-a.alive)||b.win-a.win);
document.getElementById('stage').innerHTML=ord.slice(0,2).concat(ord.slice(2)).map((a,idx)=>{
 const lead=a.alive&&idx===0;
 if(!a.alive) return `<div class="fighter ko">
   <div class="fhead"><div class="mascot" style="background:${a.color}44;color:#fff">${faceKO}</div>
    <div><h2>${a.name}</h2><div class="model m">${a.model}</div><div class="rec">${a.record} · ${a.elo} ELO</div></div></div>
   <div class="koban">☠️ ELIMINATED<small>${a.death} · ${a.at}</small></div></div>`;
 return `<div class="fighter ${lead?'lead':''}">
  ${lead?'<div class="crown">👑</div>':''}
  <div class="fhead"><div class="mascot" style="background:${a.color}">${face[a.id]}</div>
   <div><h2>${a.name}${a.streak>=2?`<span class="streak">🔥 ${a.streak} streak</span>`:''}</h2>
    <div class="model m">${a.model}</div><div class="rec">⭐ ${a.record} · ${a.elo} ELO</div></div></div>
  <div class="hpwrap"><div class="hprow"><span>SESSION INTEGRITY</span><span>${a.hp}/100</span></div>
   <div class="hpbar">${a.id==='codex'?'<span class="dmg">-18</span>':''}<i style="width:${a.hp}%;background:${hpGrad(a.hp)}"></i></div></div>
  <div class="pills">
   <div class="pill"><div class="v">⚡${a.turn}</div><div class="k">TURN</div></div>
   <div class="pill"><div class="v">🔧${a.tools}</div><div class="k">MOVES</div></div>
   <div class="pill"><div class="v">${a.win}%</div><div class="k">WIN ODDS</div></div>
  </div>
  <div class="speech"><b>${a.name}:</b> ${speech[a.id]||'…'}</div></div>`;
}).join('');
// feed
const em={elim:['💀','#3a1420'],attack:['⚔️','#2a1c52'],defend:['🛡️','#15233a'],think:['💭','#2a1c52'],tool:['⚙️','#2a1c52']};
const fd=S.feed.slice().reverse();
document.getElementById('n').textContent=fd.length+' moves';
document.getElementById('feed').innerHTML=fd.map(e=>{const w=byId(e.who),tg=e.target?byId(e.target):null,[ic]=em[e.kind];
 return `<div class="evt ${e.kind}"><div class="em" style="background:${w.color}33">${ic}</div>
  <div class="tx"><b style="color:${w.color}">${w.name}</b> ${tg?`<span style="color:var(--faint)">▶</span> <b style="color:${tg.color}">${tg.name}</b>`:''} <span style="color:var(--dim)">${e.text}</span></div>
  <span class="tt">${e.t}</span></div>`;}).join('');
// predict
const mk=[{id:'grok',o:1.47,p:68,sel:true},{id:'codex',o:3.10,p:32}];
document.getElementById('opts').innerHTML=mk.map(m=>{const a=byId(m.id);
 return `<div class="predopt ${m.sel?'sel':''}"><div class="r1"><span>${face[a.id]} ${a.name}</span><span class="od">${m.o.toFixed(2)}×</span></div>
  <div class="pbar"><i style="width:${m.p}%;background:${a.color}"></i></div>
  <div style="font-size:11px;color:var(--faint);margin-top:6px;font-family:'JetBrains Mono'">${m.p}% of players backing</div></div>`;}).join('');
</script></body></html>
